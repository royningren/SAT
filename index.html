<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAT Learning Portal — Reading &amp; Writing + Math</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "system-ui", "-apple-system", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.7); }
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes wordPop {
            0% { opacity: 0; transform: translateY(5px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .word-pop {
            display: inline;
            animation: wordPop 0.12s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes pulseBar {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }
        .voice-bar {
            animation: pulseBar 0.9s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- =================================================================== -->
    <!-- UNIFIED STUDENT PORTAL HEADER (Pure Student View, Split Switcher)   -->
    <!-- =================================================================== -->
    <header class="bg-white border-b border-slate-200/90 sticky top-0 z-30 shadow-xs">
        <div class="max-w-[1640px] mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-0 sm:h-16 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 via-violet-600 to-teal-600 text-white flex items-center justify-center shadow-sm flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h1 class="text-sm sm:text-base font-bold text-slate-900 truncate">SAT Dual-Subject Learning Portal</h1>
                        <span class="hidden sm:inline-flex px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200/80">
                            English + Math
                        </span>
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="db-status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                        <span id="db-status-text" class="text-[11px] text-slate-500 font-medium truncate">Connecting to SAT English &amp; Math Question Banks...</span>
                    </div>
                </div>
            </div>

            <!-- Layout View Switcher (Defaults to Side-by-Side Split View) -->
            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200/80 flex-shrink-0">
                <button
                    type="button"
                    data-layout="split"
                    class="layout-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer bg-slate-900 text-white shadow-xs"
                >
                    ◫ Split View
                </button>
                <button
                    type="button"
                    data-layout="english"
                    class="layout-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer text-slate-600 hover:bg-white"
                >
                    📖 English
                </button>
                <button
                    type="button"
                    data-layout="math"
                    class="layout-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer text-slate-600 hover:bg-white"
                >
                    📐 Math
                </button>
            </div>
        </div>
    </header>

    <!-- =================================================================== -->
    <!-- MAIN SPLIT WORKSPACE: LEFT = ENGLISH | RIGHT = MATH                 -->
    <!-- =================================================================== -->
    <main class="flex-1 max-w-[1640px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 fade-in">
        <div id="dual-workspace-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            <!-- LEFT PANE: SAT Reading & Writing (English) -->
            <section id="english-pane" class="min-w-0 space-y-4"></section>

            <!-- RIGHT PANE: SAT Math Practice -->
            <section id="math-pane" class="min-w-0 space-y-4"></section>
        </div>
    </main>

    <!-- =================================================================== -->
    <!-- SUBJECT WORKSPACE TEMPLATE (Cloned for English Left & Math Right)   -->
    <!-- =================================================================== -->
    <template id="subject-pane-template">
        <!-- Subject Pane Header Strip -->
        <div class="pane-header-card bg-white rounded-2xl border border-slate-200/90 p-4 shadow-xs flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="pane-icon-box w-10 h-10 rounded-xl text-white flex items-center justify-center text-lg shadow-xs flex-shrink-0"></div>
                <div class="min-w-0">
                    <div class="flex items-center gap-2">
                        <h2 class="pane-title text-sm sm:text-base font-bold text-slate-900 truncate"></h2>
                        <span class="pane-tag px-2 py-0.5 rounded-full text-[11px] font-semibold border flex-shrink-0"></span>
                    </div>
                    <p class="pane-subtitle text-[11px] text-slate-500 mt-0.5 truncate"></p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-1.5 flex-shrink-0">
                <span class="stat-focus-scope px-2.5 py-1 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600 max-w-[180px] truncate">
                    0 Open Sets
                </span>
                <span class="stat-difficulty px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-100 text-amber-700">
                    Level: Medium
                </span>
            </div>
        </div>

        <!-- Compact 4-Metric Summary Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs">
                <div class="text-[11px] font-medium text-slate-500">Strategy</div>
                <div class="stat-strategy mt-1 text-xs sm:text-sm font-bold text-indigo-700 truncate">Adaptive Difficulty</div>
                <div class="stat-strategy-sub text-[10px] text-slate-400 mt-0.5 truncate">Adjusts by streak</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs">
                <div class="text-[11px] font-medium text-slate-500">Completed</div>
                <div class="stat-total mt-1 text-xl font-bold text-slate-900">0</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs">
                <div class="text-[11px] font-medium text-slate-500">Accuracy</div>
                <div class="stat-accuracy mt-1 text-xl font-bold text-emerald-600">--%</div>
            </div>
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-xs">
                <div class="text-[11px] font-medium text-slate-500">Streak</div>
                <div class="stat-streak mt-1 text-xl font-bold text-amber-600">0</div>
            </div>
        </div>

        <!-- Virtual Tutor Guidance Banner -->
        <div class="tutor-banner rounded-2xl p-4 text-white shadow-sm flex items-start gap-3">
            <div class="tutor-avatar w-10 h-10 rounded-xl bg-white/15 border border-white/25 flex items-center justify-center text-lg flex-shrink-0">
                👩‍🏫
            </div>
            <div class="space-y-0.5 min-w-0">
                <div class="tutor-label text-[11px] font-semibold uppercase tracking-wider text-white/80">SAT Virtual Tutor</div>
                <p class="teacher-message text-xs sm:text-sm leading-relaxed text-white/95">
                    Welcome! Loading your open practice sets...
                </p>
            </div>
        </div>

        <!-- Open Practice Sets Lobby -->
        <div class="sets-lobby-section bg-white rounded-2xl border border-slate-200/90 p-4 sm:p-5 shadow-xs space-y-3.5 fade-in">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-slate-100">
                <div>
                    <h3 class="text-sm sm:text-base font-bold text-slate-900">📚 Open Practice Sets</h3>
                    <p class="text-[11px] text-slate-500 mt-0.5">Choose a set to start or resume. Completed sets clear automatically.</p>
                </div>
                <span class="lobby-sets-count px-2.5 py-1 rounded-full text-xs font-bold border">
                    0 Open Sets
                </span>
            </div>
            <div class="open-sets-list space-y-2.5"></div>
        </div>

        <!-- Active Set Progress Bar & Save/Exit Header -->
        <div class="active-set-bar hidden bg-white rounded-2xl border p-4 shadow-xs flex flex-wrap items-center justify-between gap-3 fade-in">
            <div class="min-w-0 flex-1 space-y-1.5">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="active-set-serial px-2 py-0.5 rounded-lg font-mono text-xs font-bold text-white"></span>
                    <h3 class="active-set-name text-sm font-bold text-slate-900 truncate"></h3>
                    <span class="active-set-progress-text text-xs font-semibold">0 / 0 completed</span>
                    <span class="active-set-accuracy-badge px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500">Accuracy: --%</span>
                </div>
                <div class="w-full max-w-md h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="active-set-progress-bar h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            <button
                type="button"
                class="btn-save-exit-set px-3.5 py-2 rounded-xl text-xs font-semibold border transition-colors cursor-pointer flex-shrink-0"
            >
                💾 Save &amp; Back
            </button>
        </div>

        <!-- Active Question Card -->
        <div class="question-card hidden bg-white rounded-2xl border border-slate-200/90 p-4 sm:p-5 shadow-xs space-y-4">
            <!-- Metadata Badges -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                <div class="flex flex-wrap items-center gap-1.5">
                    <span class="q-group-badge hidden px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-slate-900 text-white"></span>
                    <span class="q-answer-type-badge hidden px-2.5 py-0.5 rounded-full text-[11px] font-bold border"></span>
                    <span class="q-type-badge px-2.5 py-0.5 rounded-full text-[11px] font-bold border"></span>
                    <span class="q-category-badge px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700"></span>
                    <span class="q-difficulty-badge px-2.5 py-0.5 rounded-full text-[11px] font-semibold"></span>
                </div>
                <h4 class="q-title text-xs font-semibold text-slate-500"></h4>
            </div>

            <!-- Passage / Problem Context & Embedded Charts/Images -->
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/70 space-y-3.5">
                <div class="q-image-container hidden flex flex-col items-center gap-3"></div>
                <div class="q-passage text-sm sm:text-[15px] text-slate-800 leading-relaxed whitespace-pre-line"></div>
            </div>

            <!-- Question Stem -->
            <p class="q-stem text-sm sm:text-[15px] font-semibold text-slate-900 leading-snug"></p>

            <!-- MCQ Options List -->
            <div class="q-options-container space-y-2"></div>

            <!-- Fill-in (Student-Produced Response) Input Area (Math) -->
            <div class="q-fillin-container hidden rounded-xl bg-teal-50/55 border border-teal-200/90 p-4 space-y-2.5">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <span class="text-xs font-bold text-teal-800">✍️ Student-Produced Response (Fill-in)</span>
                    <span class="text-[11px] text-teal-700/80">Enter integer, decimal, or fraction (e.g., 18, 1.2, 6/5)</span>
                </div>
                <div class="q-fillin-prev-tries hidden flex flex-wrap items-center gap-1.5 text-xs"></div>
                <input
                    type="text"
                    autocomplete="off"
                    placeholder="Type your answer here..."
                    class="q-fillin-input w-full bg-white border-2 border-teal-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base font-mono font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500 disabled:bg-slate-100 disabled:text-slate-600"
                />
                <div class="q-fillin-result-note hidden text-xs font-semibold rounded-lg px-3 py-2 border"></div>
            </div>

            <!-- Tutor Hint Area -->
            <div class="hint-box hidden rounded-xl bg-amber-50/80 border border-amber-200 p-3.5 text-xs sm:text-sm text-amber-900 leading-relaxed fade-in">
                <div class="font-bold text-amber-800 mb-1">💡 Tutor Hint</div>
                <p class="hint-text"></p>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap items-center justify-between gap-2.5 pt-2 border-t border-slate-100">
                <button
                    type="button"
                    class="btn-toggle-hint px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200/80 transition-colors cursor-pointer"
                >
                    💡 Show Tutor Hint
                </button>

                <div class="flex items-center gap-2 ml-auto">
                    <button
                        type="button"
                        class="btn-submit-answer px-4 sm:px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-white disabled:opacity-45 disabled:cursor-not-allowed shadow-xs transition-all cursor-pointer"
                        disabled
                    >
                        Submit Answer
                    </button>
                    <button
                        type="button"
                        class="btn-next-question hidden px-4 sm:px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 shadow-xs transition-all cursor-pointer"
                    >
                        Next Question →
                    </button>
                </div>
            </div>

            <!-- Official Explanation Box -->
            <div class="explanation-box hidden rounded-xl border border-slate-200 bg-slate-50 p-4 space-y-2 fade-in">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="result-header flex items-center gap-2 font-bold text-sm"></div>
                    <button
                        type="button"
                        class="btn-speak-explanation inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-700 bg-white hover:bg-indigo-50 border border-indigo-200 shadow-xs transition-colors cursor-pointer"
                    >
                        🔊 Read Aloud
                    </button>
                </div>
                <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 pt-1">Official Explanation</div>
                <div class="explanation-text text-xs sm:text-sm text-slate-700 leading-relaxed whitespace-pre-line"></div>
            </div>
        </div>

        <!-- Completion Card -->
        <div class="daily-complete-card hidden bg-white rounded-2xl border border-emerald-200 p-6 sm:p-7 text-center shadow-xs space-y-3.5 fade-in">
            <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-center text-2xl">
                🎉
            </div>
            <div class="space-y-1">
                <h3 class="text-base font-bold text-slate-900">All Assigned Practice Complete!</h3>
                <p class="daily-complete-message text-xs sm:text-sm text-slate-600 leading-relaxed"></p>
            </div>
            <div class="daily-complete-summary inline-flex px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"></div>
        </div>

        <!-- Subject Analytics & History Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Practice Set Accuracy Summary -->
            <div class="bg-white rounded-2xl border border-slate-200/90 p-4 shadow-xs space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-900">Practice Set Accuracy</h3>
                    <span class="set-accuracy-count text-[11px] font-semibold text-slate-400">0 sets</span>
                </div>
                <div class="set-accuracy-list space-y-2.5 max-h-[240px] overflow-y-auto pr-1"></div>
            </div>

            <!-- Mastery by Question Type -->
            <div class="bg-white rounded-2xl border border-slate-200/90 p-4 shadow-xs space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-900">Mastery by Domain</h3>
                    <button
                        type="button"
                        class="btn-reset-progress text-[11px] font-medium text-slate-400 hover:text-rose-600 transition-colors cursor-pointer"
                    >
                        Reset Progress
                    </button>
                </div>
                <div class="type-mastery-list space-y-2.5"></div>
            </div>
        </div>

        <!-- Recent Attempts -->
        <div class="bg-white rounded-2xl border border-slate-200/90 p-4 shadow-xs space-y-3">
            <h3 class="text-xs sm:text-sm font-bold text-slate-900">Recent Attempts</h3>
            <div class="recent-history-list space-y-2 max-h-[240px] overflow-y-auto pr-1"></div>
        </div>
    </template>

    <!-- =================================================================== -->
    <!-- AUTO-POPUP EXPLANATION MODAL (2nd Attempt, Synced Word Pop-in)      -->
    <!-- =================================================================== -->
    <div id="explanation-popup-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/55 backdrop-blur-xs p-3 sm:p-6">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-3xl overflow-hidden fade-in flex flex-col max-h-[90vh]">
            <!-- Popup Header -->
            <div id="popup-header-bg" class="bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-5 text-white flex items-center justify-between gap-3 flex-shrink-0">
                <div class="flex items-center gap-3.5 min-w-0">
                    <div class="w-12 h-12 rounded-2xl bg-white/15 border border-white/25 flex items-center justify-center text-2xl flex-shrink-0">
                        👩‍🏫
                    </div>
                    <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2.5">
                            <h3 id="popup-modal-title" class="text-base sm:text-lg font-bold truncate">Tutor Explanation</h3>
                            <span id="popup-answer-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-400/25 text-emerald-100 border border-emerald-300/40 flex-shrink-0">
                                Answer: A
                            </span>
                        </div>
                        <div id="popup-voice-status" class="flex items-center gap-2 text-xs text-white/85 mt-1">
                            <span id="popup-voice-bars" class="inline-flex items-end gap-0.5 h-3.5">
                                <span class="voice-bar w-0.5 h-full bg-white/80 rounded-full" style="animation-delay: 0s"></span>
                                <span class="voice-bar w-0.5 h-full bg-white/80 rounded-full" style="animation-delay: 0.2s"></span>
                                <span class="voice-bar w-0.5 h-full bg-white/80 rounded-full" style="animation-delay: 0.4s"></span>
                            </span>
                            <span id="popup-status-text">Loading voice explanation...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Synchronized Pop-in Text Area -->
            <div id="popup-text-scroll" class="p-6 sm:p-8 overflow-y-auto flex-1 bg-slate-50/70">
                <div id="popup-explanation-content" class="text-base sm:text-lg text-slate-800 leading-8 whitespace-pre-line min-h-[220px]"></div>
            </div>

            <!-- Progress, Replay & Close Footer -->
            <div class="px-6 py-4 bg-white border-t border-slate-200 flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 flex-shrink-0">
                <div class="w-full sm:flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div id="popup-progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-150" style="width: 0%"></div>
                </div>
                <div class="flex items-center gap-2.5 ml-auto flex-shrink-0">
                    <button
                        id="btn-replay-explanation-popup"
                        type="button"
                        class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition-colors cursor-pointer"
                    >
                        🔁 Replay
                    </button>
                    <button
                        id="btn-close-explanation-popup"
                        type="button"
                        class="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 shadow-xs transition-colors cursor-pointer"
                    >
                        Got It, Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- CUSTOM CONFIRMATION MODAL                                           -->
    <!-- =================================================================== -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 backdrop-blur-xs p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm p-5 space-y-4">
            <h3 id="confirm-title" class="text-base font-bold text-slate-900">Confirm Action</h3>
            <p id="confirm-message" class="text-sm text-slate-600 leading-relaxed"></p>
            <div class="flex justify-end gap-2.5 pt-2">
                <button id="confirm-cancel-btn" type="button" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 cursor-pointer">
                    Cancel
                </button>
                <button id="confirm-ok-btn" type="button" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 cursor-pointer">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- =================================================================== -->
    <!-- IMAGE LIGHTBOX MODAL (Click Figure to Enlarge)                      -->
    <!-- =================================================================== -->
    <div id="image-lightbox-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-xs p-4">
        <div class="relative max-w-5xl max-h-[92vh] flex flex-col items-center">
            <button id="close-image-lightbox" type="button" class="absolute -top-3 -right-3 w-9 h-9 rounded-full bg-white text-slate-700 hover:bg-slate-100 shadow-lg flex items-center justify-center font-bold text-base cursor-pointer z-10">
                ✕
            </button>

        // ---- Answer Type & Math Fill-in Equivalence Helpers ----
        function normalizeAnswerType(rawVal, optionsArr = null) {
            const v = String(rawVal || "").trim().toLowerCase();
            if (["fill_in", "fill-in", "fillin", "spr", "grid_in", "grid-in", "free_response", "填空", "填空题"].includes(v)) {
                return "fill_in";
            }
            if (["mcq", "multiple_choice", "multiple-choice", "choice", "选择", "选择题"].includes(v)) {
                return "mcq";
            }
            if (Array.isArray(optionsArr) && optionsArr.length === 0) {
                return "fill_in";
            }
            return "mcq";
        }

        function normalizeAcceptedAnswersList(rawAccepted, primaryAnswer = "") {
            const out = [];
            const seen = new Set();
            const pushVal = (val) => {
                const s = String(val ?? "").trim();
                if (!s) return;
                const key = s.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    out.push(s);
                }
            };
            pushVal(primaryAnswer);
            if (Array.isArray(rawAccepted)) {
                rawAccepted.forEach(pushVal);
            } else if (typeof rawAccepted === "string" && rawAccepted.trim()) {
                rawAccepted.split(/[\r\n;；|]+/).forEach(pushVal);
            }
            return out;
        }

        function parseMathNumericValue(rawStr) {
            const cleaned = String(rawStr ?? "").trim().replace(/,/g, "").replace(/\s+/g, "");
            if (!cleaned) return null;
            if (/^[+-]?\d+(?:\.\d+)?$/.test(cleaned)) {
                const n = Number(cleaned);
                return Number.isFinite(n) ? n : null;
            }
            const fracMatch = cleaned.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
            if (fracMatch) {
                const num = Number(fracMatch[1]);
                const den = Number(fracMatch[2]);
                if (Number.isFinite(num) && Number.isFinite(den) && den !== 0) {
                    return num / den;
                }
            }
            return null;
        }

        function isFillInAnswerMatch(userInput, correctAnswer, acceptedAnswers = []) {
            const rawUser = String(userInput ?? "").trim();
            if (!rawUser) return false;
            const candidates = normalizeAcceptedAnswersList(acceptedAnswers, correctAnswer);
            const normText = (s) => String(s ?? "").trim().replace(/,/g, "").replace(/\s+/g, "").toLowerCase();
            const userNorm = normText(rawUser);
            const userNum = parseMathNumericValue(rawUser);

            for (const cand of candidates) {
                if (userNorm === normText(cand)) return true;
                if (userNum !== null) {
                    const candNum = parseMathNumericValue(cand);
                    if (candNum !== null && Math.abs(userNum - candNum) < 1e-6) return true;
                }
            }
            return false;
        }

        function formatCorrectAnswerLabel(q) {
            const ansType = normalizeAnswerType(q?.answerType, q?.options);
            if (ansType === "fill_in") {
                const primary = String(q?.correctAnswer ?? "").trim()
                    || (Array.isArray(q?.acceptedAnswers) ? String(q.acceptedAnswers[0] || "") : "");
                const accepted = normalizeAcceptedAnswersList(q?.acceptedAnswers, primary);
                if (accepted.length > 1) {
                    return `${primary} (or ${accepted.slice(1).join(" / ")})`;
                }
                return primary || "--";
            }
            const letters = ["A", "B", "C", "D"];
            return letters[q?.correctIndex] || "A";
        }

        function isAttemptCountedCorrect(att) {
            if (!att) return false;
            const fillHist = Array.isArray(att.submittedAnswers) ? att.submittedAnswers : [];
            const seqLen = Array.isArray(att.selectedIndices) && att.selectedIndices.length > 0
                ? att.selectedIndices.length
                : (fillHist.length > 0 ? fillHist.length : 1);
            const used = Number(att.attemptsUsed) || seqLen;
            if (used >= 2) return false;
            return Boolean(att.isCorrect);
        }

        function openAudioIdb(dbName) {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(dbName, 1);
                req.onupgradeneeded = () => {
                    const idb = req.result;
                    if (!idb.objectStoreNames.contains(AUDIO_IDB_STORE)) {
                        idb.createObjectStore(AUDIO_IDB_STORE, { keyPath: "questionId" });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbGetAudio(dbName, questionId) {
            const idb = await openAudioIdb(dbName);
            return new Promise((resolve, reject) => {
                const tx = idb.transaction(AUDIO_IDB_STORE, "readonly");
                const req = tx.objectStore(AUDIO_IDB_STORE).get(questionId);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

                clearInterval(popupFallbackTimer);
                popupFallbackTimer = null;
            }
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
                activeAudio = null;
            }
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
            }
            if (activeSpeakBtn) {
                updateSpeakButtonUI(activeSpeakBtn, "idle");
                activeSpeakBtn = null;
            } else {
                ttsState = "idle";
            }
        }

        function base64ToUint8Array(base64) {
            const bin = atob(base64);
            const len = bin.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        function containsNonEnglishCjk(text) {
            return /[\u3400-\u9FFF\uF900-\uFAFF]/.test(text || "");
        }

        function prepareSpeechText(rawText) {
            return (rawText || "")
                .replace(/Correct Answer:\s*([A-D])(?=\s|$|\.)/gi, "The correct answer is choice $1.")
                .replace(/Correct Answer:\s*([^\n]+)/gi, "The correct answer is $1.")
                .replace(/×/g, " times ")
                .replace(/÷/g, " divided by ")
                .replace(/√/g, " square root of ")
                .replace(/²/g, " squared ")
                .replace(/³/g, " cubed ")
                .replace(/≥/g, " greater than or equal to ")
                .replace(/≤/g, " less than or equal to ")
                .replace(/≠/g, " is not equal to ")
                .replace(/≈/g, " is approximately ")
                .replace(/→/g, ", which gives ")
                .replace(/△/g, "triangle ")
                .replace(/∠/g, "angle ")
                .replace(/Δ/g, "the discriminant ")
                .replace(/[•▪◦]/g, " ")
                .replace(/\s*\n+\s*/g, ". ")
                .replace(/\.\s*\./g, ".")
                .replace(/\s{2,}/g, " ")
                .trim();
        }

        async function resolveSubjectExplanationAudio(subjectDef, question, rawText) {
            const qId = question?.id || "";
            const cacheKey = `${subjectDef.appId}::${qId}`;
            if (qId && audioBlobUrlCache.has(cacheKey)) {
                return audioBlobUrlCache.get(cacheKey);
            }

            if (qId) {
                let stored = null;
                if (useCloudDb && currentUser) {
                    try {
                        const snap = await getDoc(doc(db, "artifacts", subjectDef.appId, "public", "data", "sat_question_audio", qId));
                        if (snap.exists()) stored = snap.data();
                    } catch (err) {
                        console.warn("Cloud audio fetch failed:", err);
                    }
                }
                if (!stored) {
                    try {
                        stored = await idbGetAudio(subjectDef.audioIdbName, qId);
                    } catch {}
                }
                if (stored && stored.audioBase64) {
                    const bytes = base64ToUint8Array(stored.audioBase64);
                    const blob = new Blob([bytes], { type: stored.mimeType || "audio/mpeg" });
                    const url = URL.createObjectURL(blob);
                    const result = {
                        url,
                        englishText: stored.englishText || prepareSpeechText(rawText)
                    };
                    audioBlobUrlCache.set(cacheKey, result);
                    return result;
                }
            }

            throw new Error("Pre-generated audio not found in database");
        }

        async function toggleSubjectExplanationSpeech(subjectDef, question, btnEl) {
            if ((ttsState === "playing" || ttsState === "loading") && activeSpeakBtn === btnEl) {
                stopExplanationSpeech();
                return;
            }
            stopExplanationSpeech();

            const rawText = question?.explanation || "";
            if (!rawText.trim()) return;

            const currentSession = ++speechSessionId;
            activeSpeakBtn = btnEl;
            updateSpeakButtonUI(btnEl, "loading");

            try {
                const { url: audioUrl } = await resolveSubjectExplanationAudio(subjectDef, question, rawText);
                if (currentSession !== speechSessionId) return;

                const audio = new Audio(audioUrl);
                activeAudio = audio;
                audio.onended = () => {
                    if (currentSession !== speechSessionId) return;
                    activeAudio = null;
                    updateSpeakButtonUI(btnEl, "idle");
                    activeSpeakBtn = null;
                };
                audio.onerror = () => {
                    if (currentSession !== speechSessionId) return;
                    activeAudio = null;
                    updateSpeakButtonUI(btnEl, "idle");
                    activeSpeakBtn = null;
                };

                updateSpeakButtonUI(btnEl, "playing");
                await audio.play();
            } catch {
                if (currentSession !== speechSessionId) return;

                if ("speechSynthesis" in window) {
                    const englishSpeechText = prepareSpeechText(rawText);
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(englishSpeechText);
                    utterance.lang = "en-US";
                    utterance.rate = 0.96;

                    const voices = window.speechSynthesis.getVoices() || [];
                    const preferred = voices.find((v) => /en(-|_)?US/i.test(v.lang) && /(Natural|Neural|Google|Samantha|Enhanced|Premium)/i.test(v.name))
                        || voices.find((v) => /en(-|_)?US/i.test(v.lang))
                        || voices.find((v) => /^en/i.test(v.lang));
                    if (preferred) utterance.voice = preferred;

                    utterance.onend = () => {
                        if (currentSession === speechSessionId) {
                            updateSpeakButtonUI(btnEl, "idle");
                            activeSpeakBtn = null;
                        }
                    };
                    utterance.onerror = () => {
                        if (currentSession === speechSessionId) {
                            updateSpeakButtonUI(btnEl, "idle");
                            activeSpeakBtn = null;
                        }
                    };

                    updateSpeakButtonUI(btnEl, "playing");
                    window.speechSynthesis.speak(utterance);
                } else {
                    updateSpeakButtonUI(btnEl, "idle");
                    activeSpeakBtn = null;
                    showToast("Audio playback is unavailable in this browser.", "error");
                }
            }
        }

        function setPopupStatus(mode, text) {
            const bars = document.getElementById("popup-voice-bars");
            const statusText = document.getElementById("popup-status-text");
            if (statusText) statusText.textContent = text;
            if (bars) {
                if (mode === "playing") bars.classList.remove("hidden");
                else bars.classList.add("hidden");
            }
        }

        function closeExplanationPopup() {
            const modal = document.getElementById("explanation-popup-modal");
            if (modal && !modal.classList.contains("hidden")) modal.classList.add("hidden");
            activePopupContext = null;
            stopExplanationSpeech();
        }

        function tokenizeWithWeights(text) {
            const parts = text.match(/(\n|[ \t]+|[^\s]+)/g) || [];
            let totalWeight = 0;
            let charOffset = 0;
            const tokens = parts.map((part) => {
                const startChar = charOffset;
                const startWeight = totalWeight;
                charOffset += part.length;
                let weight = 0;
                if (part === "\n") weight = 2.5;
                else if (/^\s+$/.test(part)) weight = 0.25;
                else if (/^[•▪◦\-–—]+$/.test(part)) weight = 0;
                else {
                    weight = Math.max(1.8, part.length * 0.85);
                    if (/[.!?]$/.test(part)) weight += 4.5;
                    else if (/[,;:]$/.test(part)) weight += 2;
                }
                totalWeight += weight;
                return { text: part, startChar, startWeight, cumWeight: totalWeight };
            });
            return { tokens, totalWeight: Math.max(totalWeight, 1) };
        }

        async function openExplanationPopup(subjectDef, question, correctDisplay) {
            stopExplanationSpeech();
            activePopupContext = { subjectDef, question, correctDisplay };

            const modal = document.getElementById("explanation-popup-modal");
            const headerBg = document.getElementById("popup-header-bg");
            const titleEl = document.getElementById("popup-modal-title");
            const contentEl = document.getElementById("popup-explanation-content");
            const scrollEl = document.getElementById("popup-text-scroll");
            const progressBar = document.getElementById("popup-progress-bar");
            const answerBadge = document.getElementById("popup-answer-badge");

            headerBg.className = `${subjectDef.theme.bannerBg} px-6 py-5 text-white flex items-center justify-between gap-3 flex-shrink-0`;
            titleEl.textContent = `${subjectDef.shortTitle} Tutor Explanation`;
            progressBar.className = `h-full ${subjectDef.theme.progressBar} rounded-full transition-all duration-150`;

            const rawText = question?.explanation || "No explanation available.";
            let displayText = rawText.trim();

            answerBadge.textContent = `Correct Answer: ${correctDisplay}`;
            contentEl.innerHTML = "";
            progressBar.style.width = "0%";
            setPopupStatus("loading", "Loading English voice explanation...");
            modal.classList.remove("hidden");

            let { tokens, totalWeight } = tokenizeWithWeights(displayText);
            let revealedCount = 0;

            const resetTokensForText = (newText) => {
                displayText = newText.trim();
                const parsed = tokenizeWithWeights(displayText);
                tokens = parsed.tokens;
                totalWeight = parsed.totalWeight;
                revealedCount = 0;
                contentEl.innerHTML = "";
            };

            const revealUpTo = (targetCount) => {
                const clamped = Math.min(targetCount, tokens.length);
                if (clamped <= revealedCount) return;
                const frag = document.createDocumentFragment();
                for (let i = revealedCount; i < clamped; i++) {
                    const t = tokens[i].text;
                    if (t === "\n") frag.appendChild(document.createTextNode("\n"));
                    else if (/^\s+$/.test(t)) frag.appendChild(document.createTextNode(t));
                    else {
                        const span = document.createElement("span");
                        span.className = "word-pop";
                        span.textContent = t;
                        frag.appendChild(span);
                    }
                }
                contentEl.appendChild(frag);
                revealedCount = clamped;
                progressBar.style.width = `${Math.round((revealedCount / Math.max(tokens.length, 1)) * 100)}%`;
                scrollEl.scrollTop = scrollEl.scrollHeight;
            };

            const finishPopupPlayback = () => {
                if (popupSyncRafId) {
                    cancelAnimationFrame(popupSyncRafId);
                    popupSyncRafId = null;
                }
                if (popupFallbackTimer) {
                    clearInterval(popupFallbackTimer);
                    popupFallbackTimer = null;
                }
                revealUpTo(tokens.length);
                progressBar.style.width = "100%";
                setPopupStatus("done", "Finished reading — review at your own pace, then close.");
                ttsState = "idle";
            };

            const currentSession = ++speechSessionId;
            ttsState = "loading";

            try {
                const { url: audioUrl, englishText } = await resolveSubjectExplanationAudio(subjectDef, question, rawText);
                if (currentSession !== speechSessionId) return;

                if (englishText && containsNonEnglishCjk(displayText)) {
                    resetTokensForText(englishText);
                }

                const audio = new Audio(audioUrl);
                activeAudio = audio;

                const syncLoop = () => {
                    if (currentSession !== speechSessionId || !activeAudio) return;
                    if (audio.duration && Number.isFinite(audio.duration) && audio.duration > 0) {
                        const tailSilence = Math.min(0.65, audio.duration * 0.04);
                        const effectiveDuration = Math.max(audio.duration - tailSilence, audio.duration * 0.92, 0.5);
                        const ratio = Math.min(1, (audio.currentTime + 0.28) / effectiveDuration);
                        const targetWeight = ratio * totalWeight;
                        let nextCount = revealedCount;
                        while (nextCount < tokens.length && tokens[nextCount].startWeight <= targetWeight) {
                            nextCount++;
                        }
                        if (audio.currentTime > 0.02 && nextCount === 0 && tokens.length > 0) nextCount = 1;
                        revealUpTo(nextCount);
                    }
                    if (!audio.ended && !audio.paused) {
                        popupSyncRafId = requestAnimationFrame(syncLoop);
                    }
                };

                audio.onended = () => {
                    if (currentSession !== speechSessionId) return;
                    activeAudio = null;
                    finishPopupPlayback();
                };
                audio.onerror = () => {
                    if (currentSession !== speechSessionId) return;
                    activeAudio = null;
                    finishPopupPlayback();
                };

                ttsState = "playing";
                setPopupStatus("playing", "Tutor is explaining...");
                await audio.play();
                popupSyncRafId = requestAnimationFrame(syncLoop);
            } catch {
                if (currentSession !== speechSessionId) return;

                if ("speechSynthesis" in window) {
                    const englishSpeechText = prepareSpeechText(rawText);
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(englishSpeechText);
                    utterance.lang = "en-US";
                    utterance.rate = 0.96;

                    const voices = window.speechSynthesis.getVoices() || [];
                    const preferred = voices.find((v) => /en(-|_)?US/i.test(v.lang) && /(Natural|Neural|Google|Samantha|Enhanced|Premium)/i.test(v.name))
                        || voices.find((v) => /en(-|_)?US/i.test(v.lang))
                        || voices.find((v) => /^en/i.test(v.lang));
                    if (preferred) utterance.voice = preferred;

                    let receivedBoundary = false;
                    const startTime = performance.now();
                    const estDurationMs = Math.max(1800, (englishSpeechText.length / 17.5) * 1000);

                    utterance.onboundary = (ev) => {
                        if (currentSession !== speechSessionId) return;
                        if (typeof ev.charIndex === "number") {
                            receivedBoundary = true;
                            const ratio = Math.min(1, (ev.charIndex + 12) / Math.max(englishSpeechText.length, 1));
                            const targetWeight = ratio * totalWeight;
                            let nextCount = revealedCount;
                            while (nextCount < tokens.length && tokens[nextCount].startWeight <= targetWeight) nextCount++;
                            revealUpTo(nextCount);
                        }
                    };

                    popupFallbackTimer = setInterval(() => {
                        if (currentSession !== speechSessionId) {
                            clearInterval(popupFallbackTimer);
                            popupFallbackTimer = null;
                            return;
                        }
                        if (receivedBoundary) return;
                        const elapsed = performance.now() - startTime + 260;
                        const ratio = Math.min(0.99, elapsed / estDurationMs);
                        const targetWeight = ratio * totalWeight;
                        let nextCount = revealedCount;
                        while (nextCount < tokens.length && tokens[nextCount].startWeight <= targetWeight) nextCount++;
                        revealUpTo(nextCount);
                    }, 60);

                    utterance.onend = () => {
                        if (currentSession !== speechSessionId) return;
                        finishPopupPlayback();
                    };
                    utterance.onerror = () => {
                        if (currentSession !== speechSessionId) return;
                        finishPopupPlayback();
                    };

                    ttsState = "playing";
                    setPopupStatus("playing", "Tutor is explaining...");
                    window.speechSynthesis.speak(utterance);
                } else {
                    setPopupStatus("done", "Review the explanation below, then close.");
                    let idx = 0;
                    popupFallbackTimer = setInterval(() => {
                        if (currentSession !== speechSessionId) {
                            clearInterval(popupFallbackTimer);
                            popupFallbackTimer = null;
                            return;
                        }
                        idx++;
                        revealUpTo(idx);
                        if (idx >= tokens.length) finishPopupPlayback();
                    }, 75);
                }
            }
        }

        // =====================================================================
        // 3. SUBJECT PRACTICE CONTROLLER (Independent Instance for English & Math)
        // =====================================================================
        class SubjectPracticeController {
            constructor(def, mountEl) {
                this.def = def;
                this.root = mountEl;
                this.seedByPassage = new Map(def.seedQuestions.map((q) => [q.passage.slice(0, 60), q]));

                this.state = {
                    questions: [],
                    attempts: [],
                    practiceSets: [],
                    setProgressMap: {},
                    activeSetId: null,
                    config: this.createDefaultConfig(),
                    currentQuestion: null,
                    selectedOptionIndex: null,
                    eliminatedIndices: new Set(),
                    attemptChoices: [],
                    attemptFillInAnswers: [],
                    attemptNumber: 1,
                    isAnswered: false,
                    targetDifficulty: "medium",
                    streak: 0,
                    sequentialIndex: 0
                };

                this.mountTemplate();
                this.bindEvents();
            }

            createDefaultConfig() {
