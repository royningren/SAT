            bindEvents() {
                this.q(".btn-toggle-hint").addEventListener("click", () => {
                    const hintBox = this.q(".hint-box");
                    const btn = this.q(".btn-toggle-hint");
                    const isHidden = hintBox.classList.toggle("hidden");
                    btn.textContent = isHidden ? "💡 Show Tutor Hint" : "💡 Hide Tutor Hint";
                });

                this.q(".btn-submit-answer").addEventListener("click", () => this.handleAnswerSubmit());
                this.q(".btn-next-question").addEventListener("click", () => this.matchAndDisplayNextQuestion(true));
                this.q(".btn-save-exit-set").addEventListener("click", () => this.saveCurrentSetProgress(true));
                this.q(".btn-reset-progress").addEventListener("click", () => this.handleResetStudentProgress());

                const speakBtn = this.q(".btn-speak-explanation");
                speakBtn.addEventListener("click", () => {
                    if (this.state.currentQuestion) {
                        toggleSubjectExplanationSpeech(this.def, this.state.currentQuestion, speakBtn);
                    }
                });

                const fillInInput = this.q(".q-fillin-input");
                fillInInput.addEventListener("input", () => {
                    if (this.state.isAnswered) return;
                    const q = this.state.currentQuestion;
                    if (q && normalizeAnswerType(q.answerType, q.options) === "fill_in") {
                        this.q(".btn-submit-answer").disabled = fillInInput.value.trim().length === 0;
                    }
                });
                fillInInput.addEventListener("keydown", (ev) => {
                    if (ev.key === "Enter" && !this.state.isAnswered && fillInInput.value.trim().length > 0) {
                        ev.preventDefault();
                        this.handleAnswerSubmit();
                    }
                });
            }

            // ---- Firestore Path Helpers (Strict artifacts/{appId}/public/data/...) ----
            getQuestionsCol() {
                return collection(db, "artifacts", this.def.appId, "public", "data", "sat_questions");
            }
            getAttemptsCol() {
                return collection(db, "artifacts", this.def.appId, "public", "data", "student_attempts");
            }
            getPracticeSetsCol() {
                return collection(db, "artifacts", this.def.appId, "public", "data", "practice_sets");
            }
            getSetProgressCol() {
                return collection(db, "artifacts", this.def.appId, "public", "data", "student_set_progress");
            }
            getSetProgressDoc(setId) {
                return doc(db, "artifacts", this.def.appId, "public", "data", "student_set_progress", setId);
            }
            getConfigDoc() {
                return doc(db, "artifacts", this.def.appId, "public", "data", "tutor_settings", "strategy_config");
            }

            normalizeQuestion(raw) {
                const match = raw?.passage ? this.seedByPassage.get(raw.passage.slice(0, 60)) : null;
                const inferredType = raw?.questionType || match?.questionType || this.def.defaultTypeId;
                const inferredGroup = raw?.groupNumber !== undefined && raw?.groupNumber !== null
                    ? String(raw.groupNumber).trim()
                    : (match?.groupNumber || "");
                const rawOpts = Array.isArray(raw?.options) ? raw.options : (match?.options || []);
                const inferredAnswerType = normalizeAnswerType(raw?.answerType || match?.answerType, rawOpts);

                const base = {
                    ...raw,
                    questionType: inferredType,
                    groupNumber: inferredGroup,
                    answerType: inferredAnswerType
                };

                if (inferredAnswerType === "fill_in") {
                    const primaryAns = String(raw?.correctAnswer ?? match?.correctAnswer ?? "").trim()
                        || (Array.isArray(raw?.acceptedAnswers) ? String(raw.acceptedAnswers[0] ?? "").trim() : "");
                    base.options = [];
                    base.correctIndex = null;
                    base.correctAnswer = primaryAns;
                    base.acceptedAnswers = normalizeAcceptedAnswersList(raw?.acceptedAnswers || match?.acceptedAnswers, primaryAns);
                } else {
                    base.options = rawOpts.map((o) => String(o));
                    base.correctIndex = Number.isInteger(Number(raw?.correctIndex)) && raw?.correctIndex !== null
                        ? Math.min(Math.max(0, Number(raw.correctIndex)), Math.max(0, base.options.length - 1))
                        : (match?.correctIndex ?? 0);
                }

                if (!match) return base;
                return {
                    ...base,
                    title: match.title,
                    hint: match.hint,
                    explanation: match.explanation
                };
            }

            getQuestionTypes() {
                const list = this.state.config?.questionTypes;
                return Array.isArray(list) && list.length > 0 ? list : this.def.defaultTypes;
            }

            getTypeMeta(typeId) {
                const found = this.getQuestionTypes().find((t) => t.id === typeId);
                return found || {
                    id: typeId || this.def.defaultTypeId,
                    name: typeId || this.def.defaultTypes[0].name,
                    color: "indigo",
                    categories: []
                };
            }

            // ---- Cloud & Local Data Sync ----
            async startCloudSync() {
                try {
                    const snap = await getDocs(this.getQuestionsCol());
                    if (snap.empty) {
                        const now = Date.now();
                        for (let i = 0; i < this.def.seedQuestions.length; i++) {
                            await addDoc(this.getQuestionsCol(), {
                                ...this.def.seedQuestions[i],
                                hasAudio: false,
                                createdAt: now - (this.def.seedQuestions.length - i) * 1000
                            });
                        }
                    }
                } catch (err) {
                    console.warn(`[${this.def.key}] Cloud seed check skipped:`, err);
                }

                let questionsReady = false;
                let configReady = false;
                let attemptsReady = false;
                let setsReady = false;
                let progressReady = false;
                let initialRendered = false;

                const tryInitialRender = () => {
                    if (!initialRendered && questionsReady && configReady && attemptsReady && setsReady && progressReady) {
                        initialRendered = true;
                        this.renderWorkspace();
                    }
                };

                onSnapshot(this.getQuestionsCol(), (snap) => {
                    const list = [];
                    snap.forEach((d) => list.push(this.normalizeQuestion({ id: d.id, ...d.data() })));
                    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    this.state.questions = list;
                    questionsReady = true;
                    this.renderStats();
                    if (initialRendered) this.renderWorkspace();
                    else tryInitialRender();
                }, (err) => console.warn(`[${this.def.key}] Questions snapshot error:`, err));

                onSnapshot(this.getConfigDoc(), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.state.config = {
                            strategy: data.strategy || "sequential",
                            allowHints: data.allowHints !== false,
                            autoAdvanceThreshold: Number(data.autoAdvanceThreshold) || 2,
                            focusGroup: data.focusGroup ? String(data.focusGroup).trim() : "",
                            focusTypes: Array.isArray(data.focusTypes) ? data.focusTypes : [],
                            focusCategories: Array.isArray(data.focusCategories) ? data.focusCategories : [],
                            questionOpenQuota: data.questionOpenQuota && typeof data.questionOpenQuota === "object"
                                ? { ...data.questionOpenQuota }
                                : {},
                            questionTypes: Array.isArray(data.questionTypes) && data.questionTypes.length > 0
                                ? data.questionTypes
                                : this.def.defaultTypes.map((t) => ({ ...t, categories: [...t.categories] }))
                        };
                    }
                    this.updateScopeAndStrategyUI();
                    this.renderStats();
                    configReady = true;
                    tryInitialRender();
                }, (err) => console.warn(`[${this.def.key}] Config snapshot error:`, err));

                onSnapshot(this.getPracticeSetsCol(), (snap) => {
                    const list = [];
                    snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    this.state.practiceSets = list;
                    setsReady = true;
                    this.renderStats();
                    if (initialRendered) {
                        if (this.state.activeSetId && !list.some((s) => s.id === this.state.activeSetId)) {
                            stopExplanationSpeech();
                            closeExplanationPopup();
                            this.state.activeSetId = null;
                            this.state.currentQuestion = null;
                            showToast(`[${this.def.shortTitle}] This practice set is no longer available.`, "info");
                        }
                        this.renderWorkspace();
                    } else {
                        tryInitialRender();
                    }
                }, (err) => console.warn(`[${this.def.key}] Practice sets snapshot error:`, err));

                onSnapshot(this.getSetProgressCol(), (snap) => {
                    const map = {};
                    snap.forEach((d) => {
                        map[d.id] = { id: d.id, ...d.data() };
                    });
                    this.state.setProgressMap = map;
                    progressReady = true;
                    if (initialRendered && !this.state.activeSetId) {
                        this.renderWorkspace();
                    } else {
                        tryInitialRender();
                    }
                }, (err) => console.warn(`[${this.def.key}] Set progress snapshot error:`, err));

                onSnapshot(this.getAttemptsCol(), (snap) => {
                    const list = [];
                    snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                    this.state.attempts = list;
                    attemptsReady = true;
                    this.renderStats();
                    if (!initialRendered) {
                        tryInitialRender();
                    } else if (!this.state.activeSetId) {
                        this.renderWorkspace();
                    } else {
                        this.updateActiveSetBarUI();
                    }
                }, (err) => console.warn(`[${this.def.key}] Attempts snapshot error:`, err));
            }

            loadFromLocalDb() {
                const keys = this.def.lsKeys;
                let storedQuestions = readLS(keys.QUESTIONS, null);
                if (!Array.isArray(storedQuestions) || storedQuestions.length === 0) {
                    storedQuestions = this.def.seedQuestions.map((q, idx) => ({
                        ...q,
                        id: `${this.def.key}_seed_${idx + 1}`,
                        hasAudio: false,
                        createdAt: Date.now() - (this.def.seedQuestions.length - idx) * 1000
                    }));
                    writeLS(keys.QUESTIONS, storedQuestions);
                }
                this.state.questions = storedQuestions.map((q) => this.normalizeQuestion(q));

                const storedConfig = readLS(keys.CONFIG, null);
                this.state.config = storedConfig
                    ? {
                        ...this.createDefaultConfig(),
                        ...storedConfig,
                        focusGroup: storedConfig.focusGroup ? String(storedConfig.focusGroup).trim() : "",
                        focusTypes: Array.isArray(storedConfig.focusTypes) ? storedConfig.focusTypes : [],
                        focusCategories: Array.isArray(storedConfig.focusCategories) ? storedConfig.focusCategories : [],
                        questionTypes: Array.isArray(storedConfig.questionTypes) && storedConfig.questionTypes.length > 0
                            ? storedConfig.questionTypes
                            : this.def.defaultTypes.map((t) => ({ ...t, categories: [...t.categories] }))
                    }
                    : this.createDefaultConfig();

                const storedAttempts = readLS(keys.ATTEMPTS, []);
                this.state.attempts = Array.isArray(storedAttempts) ? storedAttempts : [];

                const storedSets = readLS(keys.PRACTICE_SETS, []);
                this.state.practiceSets = Array.isArray(storedSets)
                    ? storedSets.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    : [];

                const storedProgress = readLS(keys.SET_PROGRESS, {});
                this.state.setProgressMap = storedProgress && typeof storedProgress === "object" ? storedProgress : {};

                this.updateScopeAndStrategyUI();
                this.renderStats();
                this.renderWorkspace();
            }

            // ---- Practice Set Calculations & Lobby ----
            getSetProgressSummary(setObj) {
                const qById = new Map(this.state.questions.map((q) => [q.id, q]));
                const validQuestionIds = (setObj?.questionIds || []).filter((qid) => qById.has(qid));
                const validSet = new Set(validQuestionIds);
                const setAttempts = this.state.attempts
                    .filter((a) => a.setId === setObj.id && validSet.has(a.questionId))
                    .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                const latestByQid = new Map();
                setAttempts.forEach((a) => latestByQid.set(a.questionId, a));

                const completedIds = new Set(latestByQid.keys());
                const remainingIds = validQuestionIds.filter((qid) => !completedIds.has(qid));
                const totalCount = validQuestionIds.length;
                const completedCount = completedIds.size;

                let correctCount = 0;
                let wrongCount = 0;
                latestByQid.forEach((att) => {
                    if (isAttemptCountedCorrect(att)) correctCount++;
                    else wrongCount++;
                });
                const accuracy = completedCount > 0 ? Math.round((correctCount / completedCount) * 100) : null;
                const isCompleted = totalCount > 0 && remainingIds.length === 0;
                const savedState = this.state.setProgressMap?.[setObj.id] || null;
                const hasSavedProgress = completedCount > 0
                    || Boolean(savedState && savedState.currentQuestionId && remainingIds.includes(savedState.currentQuestionId));

                return {
                    validQuestionIds,
                    completedIds,
                    remainingIds,
                    totalCount,
                    completedCount,
                    correctCount,
                    wrongCount,
                    accuracy,
                    isCompleted,
                    savedState,
                    hasSavedProgress
                };
            }

            getOpenIncompleteSets() {
                return (this.state.practiceSets || []).filter((s) => {
                    if (s.status === "closed") return false;
                    const summary = this.getSetProgressSummary(s);
                    return summary.totalCount > 0 && !summary.isCompleted;
                });
            }

            updateScopeAndStrategyUI() {
                const stratKey = this.state.config.strategy || "sequential";
                const stratInfo = STRATEGY_META[stratKey] || STRATEGY_META.sequential;
                this.q(".stat-strategy").textContent = stratInfo.name;
                this.q(".stat-strategy-sub").textContent = stratInfo.desc;

                const scopeEl = this.q(".stat-focus-scope");
                const activeSet = this.state.activeSetId ? this.state.practiceSets.find((s) => s.id === this.state.activeSetId) : null;
                if (activeSet) {
                    scopeEl.textContent = `Set ${activeSet.serialNumber}`;
                    scopeEl.title = `${activeSet.serialNumber} · ${activeSet.name}`;
                } else {
                    const openCount = this.getOpenIncompleteSets().length;
                    scopeEl.textContent = `${openCount} Open Set${openCount === 1 ? "" : "s"}`;
                    scopeEl.title = scopeEl.textContent;
                }

                const diffMeta = DIFFICULTY_META[this.state.targetDifficulty] || DIFFICULTY_META.medium;
                const diffBadge = this.q(".stat-difficulty");
                diffBadge.textContent = `Level: ${diffMeta.label}`;
                diffBadge.className = `stat-difficulty px-2.5 py-1 rounded-full text-[11px] font-semibold ${diffMeta.color}`;

                const hintBtn = this.q(".btn-toggle-hint");
                if (hintBtn) {
                    hintBtn.classList.toggle("hidden", this.state.config.allowHints === false);
                }
            }

            updateActiveSetBarUI() {
                if (!this.state.activeSetId) return;
                const activeSet = this.state.practiceSets.find((s) => s.id === this.state.activeSetId);
                if (!activeSet) return;
                const summary = this.getSetProgressSummary(activeSet);
                const pct = summary.totalCount > 0 ? Math.round((summary.completedCount / summary.totalCount) * 100) : 0;

                this.q(".active-set-serial").textContent = activeSet.serialNumber || "";
                this.q(".active-set-name").textContent = activeSet.name || "Practice Set";
                this.q(".active-set-progress-text").textContent = `${summary.completedCount} / ${summary.totalCount} completed`;
                this.q(".active-set-progress-bar").style.width = `${pct}%`;

                const accBadge = this.q(".active-set-accuracy-badge");
                if (summary.accuracy === null) {
                    accBadge.textContent = "Accuracy: --%";
                    accBadge.className = "active-set-accuracy-badge px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-100 text-slate-500";
                } else {
                    const cls = summary.accuracy >= 75
                        ? "bg-emerald-100 text-emerald-700"
                        : summary.accuracy >= 50
                            ? "bg-amber-100 text-amber-700"
                            : "bg-rose-100 text-rose-700";
                    accBadge.textContent = `Accuracy: ${summary.accuracy}% (${summary.correctCount}/${summary.completedCount})`;
                    accBadge.className = `active-set-accuracy-badge px-2 py-0.5 rounded-full text-[11px] font-bold ${cls}`;
                }
            }

            renderWorkspace() {
                const lobbyEl = this.q(".sets-lobby-section");
                const activeBar = this.q(".active-set-bar");
                const questionCard = this.q(".question-card");
                const completeCard = this.q(".daily-complete-card");

                this.updateScopeAndStrategyUI();

                if (this.state.activeSetId) {
                    const activeSet = this.state.practiceSets.find((s) => s.id === this.state.activeSetId);
                    if (!activeSet) {
                        this.state.activeSetId = null;
                        this.renderWorkspace();
                        return;
                    }
                    const summary = this.getSetProgressSummary(activeSet);
                    if (summary.isCompleted && !this.state.isAnswered) {
                        this.state.activeSetId = null;
                        this.state.currentQuestion = null;
                        this.renderWorkspace();
                        return;
                    }

                    lobbyEl.classList.add("hidden");
                    completeCard.classList.add("hidden");
                    activeBar.classList.remove("hidden");
                    questionCard.classList.remove("hidden");
                    this.updateActiveSetBarUI();
                    return;
                }

                activeBar.classList.add("hidden");
                questionCard.classList.add("hidden");

                const openSets = this.getOpenIncompleteSets();
                this.q(".lobby-sets-count").textContent = `${openSets.length} Open Set${openSets.length === 1 ? "" : "s"}`;

                if (openSets.length === 0) {
                    lobbyEl.classList.add("hidden");
                    completeCard.classList.remove("hidden");
                    const totalSets = (this.state.practiceSets || []).length;
                    this.q(".daily-complete-message").textContent = totalSets > 0
                        ? `Awesome work! You have completed all open ${this.def.shortTitle} practice sets. Check back when your instructor opens a new set.`
                        : `No ${this.def.shortTitle} practice sets are currently open. Please ask your instructor to publish a set in the admin portal.`;
                    this.q(".daily-complete-summary").textContent = totalSets > 0
                        ? `All ${totalSets} assigned ${this.def.shortTitle} set${totalSets === 1 ? "" : "s"} completed`
                        : `Waiting for instructor to open a ${this.def.shortTitle} set`;
                    this.q(".teacher-message").textContent = totalSets > 0
                        ? `Congratulations! Every open ${this.def.shortTitle} practice set has been completed.`
                        : `Welcome! Waiting for your instructor to publish an open ${this.def.title} set.`;
                    return;
                }

                completeCard.classList.add("hidden");
                lobbyEl.classList.remove("hidden");
                this.q(".teacher-message").textContent =
                    `You have ${openSets.length} open ${this.def.shortTitle} practice set${openSets.length === 1 ? "" : "s"} ready! Choose a set below to start or resume.`;

                const listEl = this.q(".open-sets-list");
                listEl.innerHTML = "";
                const th = this.def.theme;

                openSets.forEach((setObj) => {
                    const summary = this.getSetProgressSummary(setObj);
                    const pct = summary.totalCount > 0 ? Math.round((summary.completedCount / summary.totalCount) * 100) : 0;
                    const createdStr = setObj.createdAt
                        ? new Date(setObj.createdAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })
                        : "";
                    const accColor = summary.accuracy === null
                        ? "text-slate-500"
                        : summary.accuracy >= 75
                            ? "text-emerald-600"
                            : summary.accuracy >= 50
                                ? "text-amber-600"
                                : "text-rose-600";
                    const accText = summary.accuracy === null
                        ? "--%"
                        : `${summary.accuracy}% (${summary.correctCount}/${summary.completedCount})`;

                    const card = document.createElement("div");
                    card.className = `rounded-2xl border border-slate-200 ${th.setCardHover} bg-slate-50/70 p-4 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3`;
                    card.innerHTML = `
                        <div class="min-w-0 flex-1 space-y-1.5">
                            <div class="flex flex-wrap items-center gap-1.5">
                                <span class="px-2 py-0.5 rounded-lg font-mono text-[11px] font-bold bg-slate-900 text-white">${escapeHtml(setObj.serialNumber || "")}</span>
                                <h4 class="text-sm font-bold text-slate-900 truncate set-title"></h4>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                    summary.hasSavedProgress
                                        ? "bg-amber-100 text-amber-800"
                                        : "bg-emerald-100 text-emerald-700"
                                }">
                                    ${summary.hasSavedProgress ? "⏸ In Progress" : "🆕 New"}
                                </span>
                            </div>
                            <div class="flex flex-wrap items-center gap-2 text-[11px] text-slate-500">
                                <span>Done <strong class="text-slate-800">${summary.completedCount}/${summary.totalCount}</strong></span>
                                <span>·</span>
                                <span>Acc <strong class="${accColor}">${accText}</strong></span>
                                <span>·</span>
                                <span><strong class="${th.progressText}">${summary.remainingIds.length}</strong> left</span>
                                ${createdStr ? `<span>· ${createdStr}</span>` : ""}
                            </div>
                            <div class="w-full max-w-sm h-1.5 bg-slate-200/80 rounded-full overflow-hidden">
                                <div class="h-full ${th.progressBar} rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <button type="button" class="btn-enter-set px-4 py-2 rounded-xl text-xs font-semibold text-white ${th.primaryBtn} shadow-xs transition-colors cursor-pointer flex-shrink-0">
                            ${summary.hasSavedProgress ? "▶ Resume" : "▶ Start"}
                        </button>
                    `;
                    card.querySelector(".set-title").textContent = setObj.name || `${this.def.title} Set`;
                    card.querySelector(".btn-enter-set").addEventListener("click", () => this.enterPracticeSet(setObj.id));
                    listEl.appendChild(card);
                });
            }

            async saveCurrentSetProgress(andExit = false) {
                const setId = this.state.activeSetId;
                if (setId && this.state.currentQuestion && !this.state.isAnswered) {
                    const fillInInput = this.q(".q-fillin-input");
                    const payload = {
                        setId,
                        currentQuestionId: this.state.currentQuestion.id,
                        attemptNumber: this.state.attemptNumber,
                        eliminatedIndices: [...this.state.eliminatedIndices],
                        attemptChoices: [...this.state.attemptChoices],
                        attemptFillInAnswers: [...this.state.attemptFillInAnswers],
                        selectedOptionIndex: this.state.selectedOptionIndex,
                        currentFillInDraft: fillInInput ? fillInInput.value : "",
                        updatedAt: Date.now()
                    };
                    this.state.setProgressMap[setId] = payload;
                    writeLS(this.def.lsKeys.SET_PROGRESS, this.state.setProgressMap);
                    if (useCloudDb && currentUser) {
                        try {
                            await setDoc(this.getSetProgressDoc(setId), payload);
                        } catch (err) {
                            console.warn(`[${this.def.key}] Cloud progress save failed:`, err);
                        }
                    }
                }

                if (andExit) {
                    stopExplanationSpeech();
                    closeExplanationPopup();
                    this.state.activeSetId = null;
                    this.state.currentQuestion = null;
                    this.state.isAnswered = false;
                    this.renderWorkspace();
                    showToast(`💾 [${this.def.shortTitle}] Progress saved! Resume anytime.`, "success");
                }
            }

            async clearSavedSetProgress(setId) {
                if (!setId) return;
                if (this.state.setProgressMap && this.state.setProgressMap[setId]) {
                    delete this.state.setProgressMap[setId];
                    writeLS(this.def.lsKeys.SET_PROGRESS, this.state.setProgressMap);
                }
                if (useCloudDb && currentUser) {
                    try {
                        await deleteDoc(this.getSetProgressDoc(setId));
                    } catch {}
                }
            }

            enterPracticeSet(setId) {
                const setObj = this.state.practiceSets.find((s) => s.id === setId);
                if (!setObj) return;
                const summary = this.getSetProgressSummary(setObj);
                if (summary.isCompleted) {
                    showToast("This practice set is already completed!", "info");
                    this.renderWorkspace();
                    return;
                }

                this.state.activeSetId = setId;
                this.state.sequentialIndex = 0;

                const saved = summary.savedState;
                if (saved && saved.currentQuestionId && summary.remainingIds.includes(saved.currentQuestionId)) {
                    const q = this.state.questions.find((item) => item.id === saved.currentQuestionId);
                    if (q) {
                        stopExplanationSpeech();
                        closeExplanationPopup();
                        this.state.currentQuestion = q;
                        this.state.attemptNumber = Number(saved.attemptNumber) === 2 ? 2 : 1;
                        this.state.eliminatedIndices = new Set(Array.isArray(saved.eliminatedIndices) ? saved.eliminatedIndices : []);
                        this.state.attemptChoices = Array.isArray(saved.attemptChoices) ? [...saved.attemptChoices] : [];
                        this.state.attemptFillInAnswers = Array.isArray(saved.attemptFillInAnswers) ? [...saved.attemptFillInAnswers] : [];
                        this.state.selectedOptionIndex = typeof saved.selectedOptionIndex === "number" ? saved.selectedOptionIndex : null;
                        this.state.isAnswered = false;
                        this.q(".teacher-message").textContent =
                            `Welcome back! Resuming "${setObj.name}" (${summary.completedCount}/${summary.totalCount} completed).`;
                        this.renderWorkspace();
                        this.renderCurrentQuestion(saved.currentFillInDraft || "");
                        return;
                    }
                }

                this.renderWorkspace();
                this.matchAndDisplayNextQuestion(false);
            }

            matchAndDisplayNextQuestion(avoidCurrent = true) {
                stopExplanationSpeech();
                closeExplanationPopup();

                const activeSet = this.state.activeSetId ? this.state.practiceSets.find((s) => s.id === this.state.activeSetId) : null;
                if (!activeSet) {
                    this.state.activeSetId = null;
                    this.renderWorkspace();
                    return;
                }

                const summary = this.getSetProgressSummary(activeSet);
                if (summary.remainingIds.length === 0) {
                    const finishedName = activeSet.name || activeSet.serialNumber;
                    const finalAccText = summary.accuracy !== null ? `${summary.accuracy}% (${summary.correctCount}/${summary.totalCount})` : "--%";
                    this.clearSavedSetProgress(activeSet.id);
                    this.state.activeSetId = null;
                    this.state.currentQuestion = null;
                    this.state.selectedOptionIndex = null;
                    this.state.isAnswered = false;
                    this.renderWorkspace();
                    this.renderStats();
                    showToast(`🎉 [${this.def.shortTitle}] Set "${finishedName}" completed! Accuracy: ${finalAccText}`, "success");
                    return;
                }

                const qById = new Map(this.state.questions.map((q) => [q.id, q]));
                const remainingPool = summary.remainingIds.map((id) => qById.get(id)).filter(Boolean);

                const candidates = avoidCurrent && this.state.currentQuestion && remainingPool.length > 1
                    ? remainingPool.filter((q) => q.id !== this.state.currentQuestion.id)
                    : remainingPool;

                const strategy = this.state.config.strategy || "sequential";
                let chosen = null;
                let tutorPrompt = "";

                if (strategy === "sequential") {
                    chosen = candidates[0];
                    tutorPrompt = `Question ${summary.completedCount + 1} of ${summary.totalCount} (${chosen.category}). Read carefully before answering.`;
                } else if (strategy === "weakest_first") {
                    const catStats = {};
                    this.state.attempts.forEach((a) => {
                        const c = a.category || "General";
                        if (!catStats[c]) catStats[c] = { total: 0, correct: 0 };
                        catStats[c].total++;
                        if (isAttemptCountedCorrect(a)) catStats[c].correct++;
                    });
                    const sorted = [...candidates].sort((a, b) => {
                        const sa = catStats[a.category];
                        const sb = catStats[b.category];
                        const accA = sa && sa.total > 0 ? sa.correct / sa.total : 0.5;
                        const accB = sb && sb.total > 0 ? sb.correct / sb.total : 0.5;
                        return accA - accB;
                    });
                    chosen = sorted[0];
                    tutorPrompt = `Targeting your focus area: ${chosen.category}. Work through each step carefully.`;
                } else if (strategy === "wrong_review") {
                    const latestOutcome = new Map();
                    this.state.attempts.forEach((a) => latestOutcome.set(a.questionId, isAttemptCountedCorrect(a)));
                    const stillWrong = candidates.filter((q) => latestOutcome.get(q.id) === false);
                    if (stillWrong.length > 0) {
                        chosen = stillWrong[Math.floor(Math.random() * stillWrong.length)];
                        tutorPrompt = `Reviewing a previously missed ${this.getTypeMeta(chosen.questionType).name} question on ${chosen.category}.`;
                    } else {
                        chosen = candidates[Math.floor(Math.random() * candidates.length)];
                        tutorPrompt = `Question ${summary.completedCount + 1} of ${summary.totalCount} (${chosen.category}).`;
                    }
                } else if (strategy === "random") {
                    chosen = candidates[Math.floor(Math.random() * candidates.length)];
                    tutorPrompt = `Question ${summary.completedCount + 1} of ${summary.totalCount} (${this.getTypeMeta(chosen.questionType).name} · ${chosen.category}).`;
                } else {
                    const byDiff = candidates.filter((q) => q.difficulty === this.state.targetDifficulty);
                    const finalPool = byDiff.length > 0 ? byDiff : candidates;
                    chosen = finalPool[Math.floor(Math.random() * finalPool.length)];
                    const diffLabel = (DIFFICULTY_META[chosen.difficulty] || DIFFICULTY_META.medium).label;
                    tutorPrompt = `Matched at ${diffLabel} difficulty (${this.getTypeMeta(chosen.questionType).name} · ${chosen.category}).`;
                }

                this.state.currentQuestion = chosen;
                this.state.selectedOptionIndex = null;
                this.state.eliminatedIndices = new Set();
                this.state.attemptChoices = [];
                this.state.attemptFillInAnswers = [];
                this.state.attemptNumber = 1;
                this.state.isAnswered = false;

                this.q(".teacher-message").textContent = tutorPrompt;
                this.renderCurrentQuestion("");
            }

            // ---- Question Rendering (Supports both MCQ & Fill-in) ----
            renderCurrentQuestion(initialFillInDraft = "") {
                const q = this.state.currentQuestion;
                if (!q) return;

                const ansType = normalizeAnswerType(q.answerType, q.options);
                const groupBadge = this.q(".q-group-badge");
                const gLabel = String(q.groupNumber || "").trim();
                if (gLabel) {
                    groupBadge.textContent = `Group ${gLabel}`;
                    groupBadge.classList.remove("hidden");
                } else {
                    groupBadge.classList.add("hidden");
                }

                const ansTypeBadge = this.q(".q-answer-type-badge");
                if (this.def.showAnswerTypeBadge || ansType === "fill_in") {
                    const aMeta = ANSWER_TYPE_META[ansType];
                    ansTypeBadge.textContent = aMeta.shortLabel;
                    ansTypeBadge.className = `q-answer-type-badge px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${aMeta.badge}`;
                    ansTypeBadge.classList.remove("hidden");
                } else {
                    ansTypeBadge.classList.add("hidden");
                }

                const tMeta = this.getTypeMeta(q.questionType || this.def.defaultTypeId);
                const tStyle = TYPE_COLOR_STYLES[tMeta.color] || TYPE_COLOR_STYLES.indigo;
                const typeBadge = this.q(".q-type-badge");
                typeBadge.textContent = tMeta.name;
                typeBadge.className = `q-type-badge px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${tStyle}`;

                this.q(".q-category-badge").textContent = q.category || "General";

                const diffMeta = DIFFICULTY_META[q.difficulty] || DIFFICULTY_META.medium;
                const diffBadge = this.q(".q-difficulty-badge");
                diffBadge.textContent = diffMeta.label;
                diffBadge.className = `q-difficulty-badge px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${diffMeta.color}`;

                this.q(".q-title").textContent = q.title || "";
                this.q(".q-stem").textContent = q.question || "";

                // Render Passage + Inline/Unreferenced Figures
                const passageEl = this.q(".q-passage");
                const imgContainer = this.q(".q-image-container");
                passageEl.innerHTML = "";
                imgContainer.innerHTML = "";

                const imageMap = {};
                if (q.images && typeof q.images === "object") {
                    Object.entries(q.images).forEach(([k, v]) => {
                        const src = String(v || "").trim();
                        if (src) imageMap[String(k)] = src;
                    });
                }
                const legacyImg = String(q.image || "").trim();
                if (legacyImg && !imageMap["1"]) imageMap["1"] = legacyImg;

                const createZoomableFigure = (src, altText) => {
                    const fig = document.createElement("div");
                    fig.className = "my-3 flex flex-col items-center gap-1.5";
                    fig.innerHTML = `
                        <img
                            src=""
                            alt=""
                            class="max-h-[340px] max-w-full rounded-xl border border-slate-200 bg-white p-2 shadow-xs object-contain cursor-zoom-in hover:border-indigo-400 transition-colors"
                        />
                        <span class="text-[11px] font-medium text-slate-400">🔍 Click image to enlarge</span>
                    `;
                    const img = fig.querySelector("img");
                    img.src = src;
                    img.alt = altText;
                    img.addEventListener("click", () => {
                        document.getElementById("image-lightbox-img").src = src;
                        document.getElementById("image-lightbox-modal").classList.remove("hidden");
                    });
                    return fig;
                };

                const rawPassage = q.passage || "";
                const usedKeys = new Set();
                const tokenRegex = /\[\[IMG(?::([^\]]+))?\]\]/g;
                let lastIdx = 0;
                let match;

                while ((match = tokenRegex.exec(rawPassage)) !== null) {
                    if (match.index > lastIdx) {
                        passageEl.appendChild(document.createTextNode(rawPassage.slice(lastIdx, match.index)));
                    }
                    const key = String(match[1] || "1").trim();
                    const src = imageMap[key] || (key === "1" ? legacyImg : "");
                    if (src) {
                        usedKeys.add(key);
                        passageEl.appendChild(createZoomableFigure(src, `Question Figure ${key}`));
                    }
                    lastIdx = tokenRegex.lastIndex;
                }
                if (lastIdx < rawPassage.length) {
                    passageEl.appendChild(document.createTextNode(rawPassage.slice(lastIdx)));
                }

                const unreferencedImgs = Object.entries(imageMap).filter(([k]) => !usedKeys.has(k));
                if (legacyImg && !usedKeys.has("1") && !unreferencedImgs.some(([, v]) => v === legacyImg)) {
                    unreferencedImgs.push(["1", legacyImg]);
                }

                if (unreferencedImgs.length > 0) {
                    unreferencedImgs.forEach(([k, src]) => {
                        imgContainer.appendChild(createZoomableFigure(src, `Question Figure ${k}`));
                    });
                    imgContainer.classList.remove("hidden");
                } else {
                    imgContainer.classList.add("hidden");
                }

                // Hint & Explanation Reset
                const hintBox = this.q(".hint-box");
                const hintBtn = this.q(".btn-toggle-hint");
                hintBox.classList.add("hidden");
                this.q(".hint-text").textContent = q.hint || "Re-read the problem carefully and check each condition.";
                hintBtn.textContent = "💡 Show Tutor Hint";
                hintBtn.classList.toggle("hidden", this.state.config.allowHints === false);

                this.q(".explanation-box").classList.add("hidden");
                const submitBtn = this.q(".btn-submit-answer");
                const nextBtn = this.q(".btn-next-question");
                submitBtn.classList.remove("hidden");
                submitBtn.textContent = this.state.attemptNumber === 2 ? "Submit Second Try" : "Submit Answer";
                nextBtn.classList.add("hidden");

                // Switch between MCQ Options and Fill-in Input
                const optsContainer = this.q(".q-options-container");
                const fillContainer = this.q(".q-fillin-container");
                const fillInput = this.q(".q-fillin-input");
                const fillResultNote = this.q(".q-fillin-result-note");

                if (ansType === "fill_in") {
                    optsContainer.classList.add("hidden");
                    optsContainer.innerHTML = "";
                    fillContainer.classList.remove("hidden");
                    fillInput.disabled = false;
                    fillInput.value = initialFillInDraft || "";
                    fillInput.className = "q-fillin-input w-full bg-white border-2 border-teal-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base font-mono font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-500 disabled:bg-slate-100 disabled:text-slate-600";
                    fillResultNote.classList.add("hidden");
                    this.renderFillInPrevTries();
                    submitBtn.disabled = fillInput.value.trim().length === 0;
                    setTimeout(() => fillInput.focus(), 40);
                } else {
                    fillContainer.classList.add("hidden");
                    optsContainer.classList.remove("hidden");
                    submitBtn.disabled = this.state.selectedOptionIndex === null;
                    this.renderOptionsList();
                }
            }

            renderFillInPrevTries() {
                const box = this.q(".q-fillin-prev-tries");
                const tries = this.state.attemptFillInAnswers || [];
                if (tries.length === 0) {
                    box.classList.add("hidden");
                    box.innerHTML = "";
                    return;
                }
                box.classList.remove("hidden");
                const q = this.state.currentQuestion;
                box.innerHTML = `<span class="text-slate-500 font-semibold">Previous try:</span>` + tries.map((val, idx) => {
                    const ok = isFillInAnswerMatch(val, q?.correctAnswer, q?.acceptedAnswers);
                    const cls = ok
                        ? "bg-emerald-100 text-emerald-700 border-emerald-200"
                        : "bg-rose-100 text-rose-700 border-rose-200";
                    return `<span class="px-2 py-0.5 rounded-md border font-mono font-bold ${cls}">#${idx + 1}: ${escapeHtml(val)} ${ok ? "✓" : "✕"}</span>`;
                }).join("");
            }

            renderOptionsList() {
                const q = this.state.currentQuestion;
                const container = this.q(".q-options-container");
                if (!q || !container) return;

                const letters = ["A", "B", "C", "D"];
                const th = this.def.theme;
                container.innerHTML = "";

                (q.options || []).forEach((optText, idx) => {
                    const isEliminated = this.state.eliminatedIndices.has(idx);
                    const isSelected = this.state.selectedOptionIndex === idx;
                    const isCorrectOpt = idx === q.correctIndex;

                    let cardClass = "w-full text-left p-3 sm:p-3.5 rounded-xl border-2 transition-all flex items-start gap-3 ";
                    let badgeClass = "w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 ";
                    let statusTag = "";

                    if (this.state.isAnswered) {
                        if (isCorrectOpt) {
                            cardClass += "border-emerald-500 bg-emerald-50/70 text-emerald-950";
                            badgeClass += "bg-emerald-600 text-white";
                            statusTag = `<span class="ml-auto text-xs font-bold text-emerald-700 flex-shrink-0">✓ Correct</span>`;
                        } else if (isSelected || isEliminated) {
                            cardClass += "border-rose-300 bg-rose-50/60 text-rose-900 opacity-85";
                            badgeClass += "bg-rose-500 text-white";
                            statusTag = `<span class="ml-auto text-xs font-semibold text-rose-600 flex-shrink-0">✕ Incorrect</span>`;
                        } else {
                            cardClass += "border-slate-200/80 bg-slate-50/50 text-slate-500";
                            badgeClass += "bg-slate-200 text-slate-600";
                        }
                    } else if (isEliminated) {
                        cardClass += "border-rose-200 bg-rose-50/50 text-rose-400 cursor-not-allowed opacity-75";
                        badgeClass += "bg-rose-200 text-rose-700";
                        statusTag = `<span class="ml-auto text-xs font-semibold text-rose-500 flex-shrink-0">✕ Try again</span>`;
                    } else if (isSelected) {
                        cardClass += `${th.optionSelectedBorder} text-slate-900 shadow-xs cursor-pointer`;
                        badgeClass += th.optionSelectedBadge;
                    } else {
                        cardClass += `border-slate-200 ${th.optionHoverBorder} hover:bg-slate-50/70 text-slate-800 cursor-pointer`;
                        badgeClass += "bg-slate-100 text-slate-700";
                    }

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.disabled = this.state.isAnswered || isEliminated;
                    btn.className = cardClass;
                    btn.innerHTML = `
                        <span class="${badgeClass}">${letters[idx]}</span>
                        <span class="text-xs sm:text-sm leading-relaxed flex-1 opt-label"></span>
                        ${statusTag}
                    `;
                    btn.querySelector(".opt-label").textContent = optText;

                    if (!this.state.isAnswered && !isEliminated) {
                        btn.addEventListener("click", () => {
                            this.state.selectedOptionIndex = idx;
                            this.q(".btn-submit-answer").disabled = false;
                            this.renderOptionsList();
                        });
                    }

                    container.appendChild(btn);
                });
            }

            // ---- Answer Submission (MCQ + Fill-in, Unified 2-Try Rules) ----
            async handleAnswerSubmit() {
                const q = this.state.currentQuestion;
                const activeSet = this.state.activeSetId ? this.state.practiceSets.find((s) => s.id === this.state.activeSetId) : null;
                if (!q || !activeSet || this.state.isAnswered) return;

                const ansType = normalizeAnswerType(q.answerType, q.options);
                let isCorrect = false;
                let fillInVal = "";

                if (ansType === "fill_in") {
                    const fillInput = this.q(".q-fillin-input");
                    fillInVal = (fillInput?.value || "").trim();
                    if (!fillInVal) return;
                    isCorrect = isFillInAnswerMatch(fillInVal, q.correctAnswer, q.acceptedAnswers);
                    this.state.attemptFillInAnswers.push(fillInVal);
                } else {
                    if (this.state.selectedOptionIndex === null) return;
                    isCorrect = this.state.selectedOptionIndex === q.correctIndex;
                    this.state.attemptChoices.push(this.state.selectedOptionIndex);
                }

                // 1st wrong try -> give 2nd chance & persist progress
                if (!isCorrect && this.state.attemptNumber === 1) {
                    this.state.attemptNumber = 2;
                    const submitBtn = this.q(".btn-submit-answer");
                    submitBtn.disabled = true;
                    submitBtn.textContent = "Submit Second Try";

                    if (ansType === "fill_in") {
                        const fillInput = this.q(".q-fillin-input");
                        fillInput.value = "";
                        fillInput.focus();
                        this.renderFillInPrevTries();
                        this.q(".teacher-message").textContent =
                            `"${fillInVal}" is not quite right. Double-check your algebra/calculations—you have one more try (2nd-try answers are recorded as missed for review).`;
                    } else {
                        this.state.eliminatedIndices.add(this.state.selectedOptionIndex);
                        this.state.selectedOptionIndex = null;
                        this.renderOptionsList();
                        this.q(".teacher-message").textContent =
                            "Not quite! Take another close look and eliminate distractions—you have one more try (note: 2nd-try answers are recorded as missed for review).";
                    }
                    await this.saveCurrentSetProgress(false);
                    return;
                }

                // Finalize Question Attempt
                this.state.isAnswered = true;
                const solvedOnFirstTry = isCorrect && this.state.attemptNumber === 1;
                const countedAsCorrect = solvedOnFirstTry;
                const correctDisplay = formatCorrectAnswerLabel(q);

                if (countedAsCorrect) {
                    this.state.streak++;
                    const threshold = Number(this.state.config.autoAdvanceThreshold) || 2;
                    if (this.state.streak >= threshold) {
                        if (this.state.targetDifficulty === "easy") this.state.targetDifficulty = "medium";
                        else if (this.state.targetDifficulty === "medium") this.state.targetDifficulty = "hard";
                    }
                } else {
                    this.state.streak = 0;
                    if (this.state.targetDifficulty === "hard") this.state.targetDifficulty = "medium";
                    else if (this.state.targetDifficulty === "medium") this.state.targetDifficulty = "easy";
                }

                this.updateScopeAndStrategyUI();

                if (ansType === "fill_in") {
                    const fillInput = this.q(".q-fillin-input");
                    const noteEl = this.q(".q-fillin-result-note");
                    fillInput.disabled = true;
                    fillInput.className = isCorrect
                        ? "q-fillin-input w-full bg-emerald-50 border-2 border-emerald-500 rounded-xl px-3.5 py-2.5 text-sm sm:text-base font-mono font-bold text-emerald-900"
                        : "q-fillin-input w-full bg-rose-50 border-2 border-rose-400 rounded-xl px-3.5 py-2.5 text-sm sm:text-base font-mono font-bold text-rose-900";
                    this.renderFillInPrevTries();
                    noteEl.classList.remove("hidden");
                    noteEl.className = isCorrect
                        ? "q-fillin-result-note text-xs font-semibold rounded-lg px-3 py-2 border bg-emerald-50 text-emerald-800 border-emerald-200"
                        : "q-fillin-result-note text-xs font-semibold rounded-lg px-3 py-2 border bg-rose-50 text-rose-800 border-rose-200";
                    noteEl.textContent = `Standard Answer: ${correctDisplay}`;
                } else {
                    this.renderOptionsList();
                }

                const submitBtn = this.q(".btn-submit-answer");
                const nextBtn = this.q(".btn-next-question");
                submitBtn.classList.add("hidden");
                nextBtn.classList.remove("hidden");

                const expBox = this.q(".explanation-box");
                const resultHeader = this.q(".result-header");
                expBox.classList.remove("hidden");
                this.q(".explanation-text").textContent = q.explanation || "No explanation provided.";

                if (solvedOnFirstTry) {
                    resultHeader.className = "result-header flex items-center gap-2 font-bold text-sm text-emerald-700";
                    resultHeader.textContent = `✅ Correct! (Answer: ${correctDisplay})`;
                    this.q(".teacher-message").textContent =
                        "Spot on! Review the step-by-step breakdown below or move on to the next question.";
                } else if (isCorrect) {
                    resultHeader.className = "result-header flex items-center gap-2 font-bold text-sm text-rose-700";
                    resultHeader.textContent = `⚠️ Found ${correctDisplay} on 2nd try — Counted as Missed`;
                    this.q(".teacher-message").textContent =
                        `You got ${correctDisplay} on your second try (recorded as missed since it required 2 attempts). Listen to the explanation.`;
                } else {
                    resultHeader.className = "result-header flex items-center gap-2 font-bold text-sm text-rose-700";
                    resultHeader.textContent = `❌ Incorrect — Correct Answer: ${correctDisplay}`;
                    this.q(".teacher-message").textContent =
                        `That was your second attempt. The correct answer is ${correctDisplay}. Listen to and review the full explanation.`;
                }

                // Construct Attempt Record (100% compatible with both sat.html & sat_math_admin.html)
                const baseAttempt = {
                    setId: activeSet.id,
                    setSerialNumber: activeSet.serialNumber || "",
                    setName: activeSet.name || "",
                    questionId: q.id,
                    questionTitle: q.title || "",
                    questionType: q.questionType || this.def.defaultTypeId,
                    answerType: ansType,
                    category: q.category || "General",
                    difficulty: q.difficulty || "medium",
                    isCorrect: Boolean(countedAsCorrect),
                    attemptsUsed: this.state.attemptNumber,
                    timestamp: Date.now()
                };

                const attemptPayload = ansType === "fill_in"
                    ? {
                        ...baseAttempt,
                        correctIndex: null,
                        submittedAnswer: fillInVal,
                        submittedAnswers: [...this.state.attemptFillInAnswers],
                        correctAnswer: q.correctAnswer || "",
                        acceptedAnswers: normalizeAcceptedAnswersList(q.acceptedAnswers, q.correctAnswer),
                        finalCorrect: Boolean(isCorrect)
                    }
                    : {
                        ...baseAttempt,
                        selectedIndex: this.state.selectedOptionIndex,
                        selectedIndices: [...this.state.attemptChoices],
                        correctIndex: q.correctIndex
                    };

                await this.recordAttemptToDb(attemptPayload);
                await this.clearSavedSetProgress(activeSet.id);
                this.updateActiveSetBarUI();

                const updatedSummary = this.getSetProgressSummary(activeSet);
                nextBtn.textContent = updatedSummary.remainingIds.length === 0
                    ? "🎉 Finish Set & Return"
                    : "Next Question →";

                if (!solvedOnFirstTry) {
                    openExplanationPopup(this.def, q, correctDisplay);
                }
            }

            async recordAttemptToDb(attemptRecord) {
                if (useCloudDb && currentUser) {
                    try {
                        const docRef = await addDoc(this.getAttemptsCol(), attemptRecord);
                        if (!this.state.attempts.some((a) => a.id === docRef.id)) {
                            this.state.attempts.push({ id: docRef.id, ...attemptRecord });
                            this.renderStats();
                        }
                    } catch (err) {
                        console.warn(`[${this.def.key}] Cloud attempt write failed, saving locally:`, err);
                        this.state.attempts.push({ id: "att_" + Date.now(), ...attemptRecord });
                        writeLS(this.def.lsKeys.ATTEMPTS, this.state.attempts);
                        this.renderStats();
                    }
                } else {
                    this.state.attempts.push({ id: "att_" + Date.now(), ...attemptRecord });
                    writeLS(this.def.lsKeys.ATTEMPTS, this.state.attempts);
                    this.renderStats();
                }
            }

            renderStats() {
                const total = this.state.attempts.length;
                const correct = this.state.attempts.filter((a) => isAttemptCountedCorrect(a)).length;
                this.q(".stat-total").textContent = String(total);
                this.q(".stat-accuracy").textContent = total > 0 ? `${Math.round((correct / total) * 100)}%` : "--%";
                this.q(".stat-streak").textContent = String(this.state.streak);

                // Practice Set Accuracy
                const setAccEl = this.q(".set-accuracy-list");
                const setAccCountEl = this.q(".set-accuracy-count");
                const allSets = this.state.practiceSets || [];
                setAccCountEl.textContent = `${allSets.length} set${allSets.length === 1 ? "" : "s"}`;

                if (allSets.length === 0) {
                    setAccEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No practice sets available yet.</p>`;
                } else {
                    setAccEl.innerHTML = "";
                    allSets.forEach((setObj) => {
                        const summary = this.getSetProgressSummary(setObj);
                        const acc = summary.accuracy;
                        const barColor = acc === null
                            ? "bg-slate-200"
                            : acc >= 75
                                ? "bg-emerald-500"
                                : acc >= 50
                                    ? "bg-amber-500"
                                    : "bg-rose-500";
                        const accTextColor = acc === null
                            ? "text-slate-400"
                            : acc >= 75
                                ? "text-emerald-600"
                                : acc >= 50
                                    ? "text-amber-600"
                                    : "text-rose-600";
                        const statusPill = summary.isCompleted
                            ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-emerald-100 text-emerald-700">✓ Done</span>`
                            : summary.completedCount > 0
                                ? `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-amber-100 text-amber-700">In Progress</span>`
                                : `<span class="px-1.5 py-0.5 rounded-md text-[10px] font-semibold bg-slate-100 text-slate-500">New</span>`;

                        const item = document.createElement("div");
                        item.className = "rounded-xl bg-slate-50/90 border border-slate-200/70 p-2.5 space-y-1.5";
                        item.innerHTML = `
                            <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="px-1.5 py-0.5 rounded bg-slate-900 text-white font-mono text-[10px] font-bold flex-shrink-0">${escapeHtml(setObj.serialNumber || "--")}</span>
                                    <span class="text-xs font-semibold text-slate-800 truncate set-acc-name"></span>
                                </div>
                                ${statusPill}
                            </div>
                            <div class="flex items-center justify-between text-[11px]">
                                <span class="text-slate-500">${summary.completedCount}/${summary.totalCount} done</span>
                                <span class="font-bold ${accTextColor}">
                                    ${acc !== null ? `${acc}% (${summary.correctCount}/${summary.completedCount})` : "--%"}
                                </span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-200/80 rounded-full overflow-hidden">
                                <div class="h-full ${barColor} rounded-full transition-all duration-300" style="width: ${acc !== null ? Math.max(acc, 6) : 0}%"></div>
                            </div>
                        `;
                        item.querySelector(".set-acc-name").textContent = setObj.name || "Practice Set";
                        setAccEl.appendChild(item);
                    });
                }

                // Mastery by Domain
                const masteryEl = this.q(".type-mastery-list");
                const typeStats = {};
                this.getQuestionTypes().forEach((t) => {
                    typeStats[t.id] = { meta: t, total: 0, correct: 0 };
                });
                this.state.attempts.forEach((a) => {
                    const tid = a.questionType || this.def.defaultTypeId;
                    if (!typeStats[tid]) typeStats[tid] = { meta: this.getTypeMeta(tid), total: 0, correct: 0 };
                    typeStats[tid].total++;
                    if (isAttemptCountedCorrect(a)) typeStats[tid].correct++;
                });

                masteryEl.innerHTML = "";
                Object.values(typeStats).forEach((s) => {
                    const pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
                    const barColor = s.total === 0 ? "bg-slate-200" : pct >= 75 ? "bg-emerald-500" : pct >= 50 ? "bg-amber-500" : "bg-rose-500";
                    const item = document.createElement("div");
                    item.className = "space-y-1";
                    item.innerHTML = `
                        <div class="flex justify-between gap-2 text-xs">
                            <span class="font-semibold text-slate-800 truncate">${escapeHtml(s.meta.name)}</span>
                            <span class="text-slate-500 flex-shrink-0">${s.total > 0 ? `${pct}% (${s.correct}/${s.total})` : "Not started"}</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full ${barColor} rounded-full transition-all duration-300" style="width: ${s.total > 0 ? Math.max(pct, 6) : 0}%"></div>
                        </div>
                    `;
                    masteryEl.appendChild(item);
                });

                // Recent Attempts
                const recentEl = this.q(".recent-history-list");
                const recent = [...this.state.attempts].slice(-8).reverse();
                if (recent.length === 0) {
                    recentEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-5">No ${this.def.shortTitle} questions completed yet.</p>`;
                    return;
                }
                recentEl.innerHTML = "";
                recent.forEach((att) => {
                    const countedOk = isAttemptCountedCorrect(att);
                    const ansType = att.answerType ? normalizeAnswerType(att.answerType) : (att.correctIndex === null ? "fill_in" : "mcq");
                    const ansTag = this.def.showAnswerTypeBadge
                        ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold border ${ANSWER_TYPE_META[ansType].badge}">${ansType === "fill_in" ? "✍️" : "☑️"}</span>`
                        : "";
                    const row = document.createElement("div");
                    row.className = "flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200/70 text-xs";
                    row.innerHTML = `
                        <div class="min-w-0">
                            <div class="flex items-center gap-1.5">
                                ${ansTag}
                                <span class="font-semibold text-slate-800 truncate att-title"></span>
                            </div>
                            <div class="text-[11px] text-slate-400 truncate mt-0.5">${att.setSerialNumber ? `[${escapeHtml(att.setSerialNumber)}] ` : ""}${escapeHtml(this.getTypeMeta(att.questionType).name)} · ${escapeHtml(att.category || "General")}</div>
                        </div>
                        <span class="px-2 py-0.5 rounded-full font-bold flex-shrink-0 ${
                            countedOk ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"
                        }">
                            ${countedOk ? "✓ Correct" : "✕ Missed"}
                        </span>
                    `;
                    row.querySelector(".att-title").textContent = att.questionTitle || att.questionId;
                    recentEl.appendChild(row);
                });
            }

            handleResetStudentProgress() {
                openConfirmModal(
                    `Reset ${this.def.shortTitle} Progress`,
                    `Are you sure you want to clear your ${this.def.title} practice history and reset your current streak? (The other subject will not be affected.)`,
                    async () => {
                        try {
                            if (useCloudDb && currentUser) {
                                for (const att of this.state.attempts) {
                                    await deleteDoc(doc(db, "artifacts", this.def.appId, "public", "data", "student_attempts", att.id));
                                }
                                for (const setId of Object.keys(this.state.setProgressMap || {})) {
                                    try {
                                        await deleteDoc(this.getSetProgressDoc(setId));
                                    } catch {}
                                }
                            }
                            this.state.attempts = [];
                            this.state.setProgressMap = {};
                            this.state.activeSetId = null;
                            this.state.currentQuestion = null;
                            this.state.isAnswered = false;
                            this.state.streak = 0;
                            this.state.targetDifficulty = "medium";
                            this.state.sequentialIndex = 0;
                            writeLS(this.def.lsKeys.ATTEMPTS, []);
                            writeLS(this.def.lsKeys.SET_PROGRESS, {});
                            this.updateScopeAndStrategyUI();
                            this.renderStats();
                            this.renderWorkspace();
                            showToast(`${this.def.shortTitle} practice progress has been reset.`, "success");
                        } catch (err) {
                            showToast("Reset failed: " + err.message, "error");
                        }
                    }
                );
            }
        }

        // =====================================================================
        // 4. FIREBASE INITIALIZATION & DUAL-PANE BOOTSTRAP
        // =====================================================================
        function resolveFirebaseConfig() {
            try {
                const params = new URLSearchParams(window.location.search);
                const fbParam = params.get("fb");
                if (fbParam) {
                    const decoded = JSON.parse(decodeURIComponent(escape(atob(fbParam))));
                    if (decoded && decoded.apiKey && decoded.projectId) {
                        writeLS("sat_custom_firebase_config_v1", decoded);
                        return { config: decoded, source: "url" };
                    }
                }
            } catch (err) {
                console.warn("Invalid URL Firebase config param:", err);
            }

            const savedEn = readLS("sat_custom_firebase_config_v1", null);
            if (savedEn && savedEn.apiKey && savedEn.projectId) {
                return { config: savedEn, source: "custom-ls" };
            }
            const savedMath = readLS("sat_math_custom_firebase_config_v1", null);
            if (savedMath && savedMath.apiKey && savedMath.projectId) {
                return { config: savedMath, source: "custom-ls" };
            }
            if (CUSTOM_FIREBASE_CONFIG && CUSTOM_FIREBASE_CONFIG.apiKey && CUSTOM_FIREBASE_CONFIG.projectId) {
                return { config: CUSTOM_FIREBASE_CONFIG, source: "built-in" };
            }
            return { config: null, source: "none" };
        }

        const englishController = new SubjectPracticeController(
            SUBJECT_DEFINITIONS.english,
            document.getElementById("english-pane")
        );
        const mathController = new SubjectPracticeController(
            SUBJECT_DEFINITIONS.math,
            document.getElementById("math-pane")
        );

        async function bootstrapDualPortal() {
            try {
                const { config: firebaseConfig, source } = resolveFirebaseConfig();
                if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.projectId) {
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);

                    if (source === "env" && typeof __initial_auth_token !== "undefined" && __initial_auth_token) {
                        try {
                            const cred = await signInWithCustomToken(auth, __initial_auth_token);
                            currentUser = cred.user;
                        } catch {
                            const cred = await signInAnonymously(auth);
                            currentUser = cred.user;
                        }
                    } else {
                        const cred = await signInAnonymously(auth);
                        currentUser = cred.user;
                    }

                    if (!currentUser) throw new Error("Firebase anonymous auth failed");

                    useCloudDb = true;
                    setDbStatus(true, `Cloud Synced (${firebaseConfig.projectId} · English & Math)`);
                    await Promise.all([
                        englishController.startCloudSync(),
                        mathController.startCloudSync()
                    ]);
                    return;
                }
            } catch (err) {
                console.warn("Firebase unavailable, falling back to local DB:", err);
            }

            useCloudDb = false;
            currentUser = { uid: "student-local" };
            setDbStatus(false, "Local Practice Banks (Browser Storage · English & Math)");
            englishController.loadFromLocalDb();
            mathController.loadFromLocalDb();
        }

        // =====================================================================
        // 5. LAYOUT SWITCHER & GLOBAL MODAL EVENT LISTENERS
        // =====================================================================
        function setWorkspaceLayout(mode) {
            const grid = document.getElementById("dual-workspace-grid");
            const enPane = document.getElementById("english-pane");
            const mathPane = document.getElementById("math-pane");

            document.querySelectorAll(".layout-mode-btn").forEach((btn) => {
                const active = btn.dataset.layout === mode;
                btn.className = active
                    ? "layout-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer bg-slate-900 text-white shadow-xs"
                    : "layout-mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors cursor-pointer text-slate-600 hover:bg-white";
            });

            if (mode === "english") {
                grid.className = "grid grid-cols-1 max-w-4xl mx-auto gap-6 items-start";
                enPane.classList.remove("hidden");
                mathPane.classList.add("hidden");
            } else if (mode === "math") {
                grid.className = "grid grid-cols-1 max-w-4xl mx-auto gap-6 items-start";
                enPane.classList.add("hidden");
                mathPane.classList.remove("hidden");
            } else {
                grid.className = "grid grid-cols-1 lg:grid-cols-2 gap-6 items-start";
                enPane.classList.remove("hidden");
                mathPane.classList.remove("hidden");
            }
        }

        document.querySelectorAll(".layout-mode-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                if (btn.dataset.layout) setWorkspaceLayout(btn.dataset.layout);
            });
        });

        // Shared Popup Explanation Controls
        document.getElementById("btn-replay-explanation-popup").addEventListener("click", () => {
            if (activePopupContext) {
                openExplanationPopup(
                    activePopupContext.subjectDef,
                    activePopupContext.question,
                    activePopupContext.correctDisplay
                );
            }
        });
        document.getElementById("btn-close-explanation-popup").addEventListener("click", closeExplanationPopup);
        window.addEventListener("beforeunload", stopExplanationSpeech);

        // Shared Image Lightbox Controls
        const closeStudentLightbox = () => {
            const modal = document.getElementById("image-lightbox-modal");
            const img = document.getElementById("image-lightbox-img");
            if (modal) modal.classList.add("hidden");
            if (img) img.src = "";
        };
        document.getElementById("close-image-lightbox").addEventListener("click", closeStudentLightbox);
        document.getElementById("image-lightbox-modal").addEventListener("click", (ev) => {
            if (ev.target.id === "image-lightbox-modal") closeStudentLightbox();
        });
        document.addEventListener("keydown", (ev) => {
            if (ev.key === "Escape") {
                const lightbox = document.getElementById("image-lightbox-modal");
                if (lightbox && !lightbox.classList.contains("hidden")) {
                    closeStudentLightbox();
                } else {
                    closeExplanationPopup();
                }
            }
        });

        bootstrapDualPortal();
    </script>
</body>
</html>
